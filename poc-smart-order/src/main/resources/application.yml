spring:
  application:
    name: smart-order-orchestrator

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Garantie exactly-once en production
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      # false = commit manuel pour garantir l'idempotence
      enable-auto-commit: false

kafka:
  topics:
    order-created: order.created
    order-completed: order.completed
    order-failed: order.failed
  consumer:
    group-id: order-orchestrator-group

external:
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8081}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  billing:
    base-url: ${BILLING_SERVICE_URL:http://localhost:8083}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.company.order: DEBUG
    org.springframework.kafka: INFO
